<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل ديرتك - النسخة الشاملة</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --primary: #002d5b; --gold: #ffd700; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); margin: 0; padding: 0; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, #004a99 100%); color: white; padding: 30px 20px; text-align: center; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
        .container { max-width: 550px; margin: -20px auto 0; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; }
        
        #map { height: 200px; width: 100%; border-radius: 15px; margin: 10px 0; border: 2px solid var(--primary); }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; display: block; text-decoration: none; text-align: center; margin-top: 10px; }
        .btn-main { background: var(--primary); color: white; }
        .btn-call { background: #28a745; color: white; }
        
        /* نظام النجوم */
        .stars-container { color: #ccc; font-size: 24px; cursor: pointer; margin: 10px 0; }
        .stars-active { color: var(--gold); }
        .rating-display { color: var(--gold); font-weight: bold; font-size: 14px; }

        .worker-card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 15px; border-right: 8px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* لوحة الإدارة والإحصائيات */
        .admin-trigger { position: fixed; bottom: 20px; left: 20px; width: 50px; height: 50px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1000; border: 2px solid white; font-size: 10px; font-weight: bold; }
        #admin-panel { display: none; background: white; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .stat-box { background: #eef2f7; padding: 15px; border-radius: 15px; margin-bottom: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; }
        .stat-item { background: white; padding: 10px; border-radius: 10px; border: 1px solid #ddd; }
        .stat-num { display: block; font-size: 20px; font-weight: bold; color: var(--primary); }

        #reg-section, #profile-section { display: none; }
    </style>
</head>
<body>

<div class="admin-trigger" onclick="openAdmin()">إدارة</div>

<div class="header">
    <h1>🇮🇶 دليل ديرتك</h1>
    <p id="visitor-count">الزوار حالياً: جاري التحميل...</p>
</div>

<div class="container">
    <div id="reg-section" class="card">
        <h2 style="text-align:center;">تسجيل الهوية ✨</h2>
        <input type="text" id="reg-name" placeholder="الأسم الكامل">
        <input type="tel" id="reg-phone" placeholder="رقم الموبايل">
        <select id="reg-type" onchange="toggleFields()"><option value="driver">سائق</option><option value="worker">أسطى</option></select>
        <div id="worker-extra" style="display:none;"><input type="text" id="reg-job" placeholder="المهنة"><input type="text" id="reg-area" placeholder="المنطقة"></div>
        <div id="map"></div>
        <input type="hidden" id="lat"><input type="hidden" id="lng">
        <button class="btn btn-main" onclick="register()">حفظ البيانات ✅</button>
    </div>

    <div id="profile-section" class="card" style="text-align:center;">
        <h2 id="welcome-user">مرحباً</h2>
        <button class="btn btn-main" onclick="location.reload()">تحديث القائمة</button>
        <button onclick="logout()" style="color:red; background:none; border:none; margin-top:15px;">خروج</button>
    </div>

    <h2 style="text-align:center; color: var(--primary);">🛠️ الأسطوات المتوفرين</h2>
    <div id="display-list"></div>
</div>

<div id="admin-panel">
    <button onclick="closeAdmin()" style="padding:10px;">🔙 عودة</button>
    <h2 style="text-align:center;">لوحة التحكم والإحصائيات</h2>
    <div class="stat-box">
        <div class="stat-item">السواق<span id="stat-drivers" class="stat-num">0</span></div>
        <div class="stat-item">الأسطوات<span id="stat-workers" class="stat-num">0</span></div>
    </div>
    <div id="admin-list"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDING7DzLK9YwWtdBt1CLJhFPOqRrCBo8s",
        authDomain: "darji-app-13348.firebaseapp.com",
        databaseURL: "https://darji-app-13348-default-rtdb.firebaseio.com",
        projectId: "darji-app-13348",
        storageBucket: "darji-app-13348.firebasestorage.app",
        messagingSenderId: "553323569740",
        appId: "1:553323569740:web:57075700fe68af3d010ae9"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // عداد الزوار (تجريبي)
    const presenceRef = db.ref('presence');
    const myPresence = presenceRef.push(true);
    myPresence.onDisconnect().remove();
    presenceRef.on('value', snap => { document.getElementById('visitor-count').innerText = "الزوار حالياً: " + snap.numChildren(); });

    let map = L.map('map').setView([31.84, 47.14], 12); 
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    let marker = L.marker([31.84, 47.14], {draggable: true}).addTo(map);
    map.on('click', e => { marker.setLatLng(e.latlng); document.getElementById('lat').value = e.latlng.lat; document.getElementById('lng').value = e.latlng.lng; });

    window.onload = () => {
        const user = localStorage.getItem('satar_system_user');
        if (user) { document.getElementById('profile-section').style.display = 'block'; document.getElementById('welcome-user').innerText = "أهلاً " + JSON.parse(user).name; }
        else { document.getElementById('reg-section').style.display = 'block'; setTimeout(() => map.invalidateSize(), 500); }
        loadData();
    };

    function toggleFields() { document.getElementById('worker-extra').style.display = (document.getElementById('reg-type').value === 'worker') ? 'block' : 'none'; }

    function register() {
        const name = document.getElementById('reg-name').value;
        const phone = document.getElementById('reg-phone').value;
        if(!name || !phone) return alert("أكمل البيانات");
        const data = { name, phone, lat: document.getElementById('lat').value || 31.84, lng: document.getElementById('lng').value || 47.14, type: document.getElementById('reg-type').value, job: document.getElementById('reg-job').value || "سائق", area: document.getElementById('reg-area').value || "ميسان", rating: 0, ratingCount: 0 };
        db.ref('users').push(data).then(() => { localStorage.setItem('satar_system_user', JSON.stringify(data)); location.reload(); });
    }

    function loadData() {
        db.ref('users').on('value', (snap) => {
            const list = document.getElementById('display-list');
            const aList = document.getElementById('admin-list');
            let dCount = 0, wCount = 0;
            list.innerHTML = ''; aList.innerHTML = '';
            
            snap.forEach((child) => {
                const v = child.val();
                const stars = v.ratingCount > 0 ? (v.rating / v.ratingCount).toFixed(1) : "0";
                if(v.type === 'worker') {
                    wCount++;
                    list.innerHTML += `<div class="worker-card">
                        <h3>الأسطى ${v.name} (${v.job})</h3>
                        <p>📍 ${v.area} | ⭐ التقييم: ${stars}</p>
                        <div class="stars-container" onclick="rateUser('${child.key}', ${v.rating || 0}, ${v.ratingCount || 0})">⭐⭐⭐⭐⭐ (قيم الآن)</div>
                        <a href="tel:${v.phone}" class="btn btn-call">📞 إتصال</a>
                    </div>`;
                } else { dCount++; }
                aList.innerHTML += `<div style="border-bottom:1px solid #eee; padding:10px;"><b>${v.name}</b> (${v.type}) - ⭐ ${stars} <button onclick="delUser('${child.key}')" style="color:red;">حذف</button></div>`;
            });
            document.getElementById('stat-drivers').innerText = dCount;
            document.getElementById('stat-workers').innerText = wCount;
        });
    }

    function rateUser(key, currentRating, count) {
        const star = prompt("قيم الأسطى من 1 إلى 5:");
        if(star >= 1 && star <= 5) {
            db.ref('users/' + key).update({ rating: currentRating + parseInt(star), ratingCount: count + 1 });
            alert("شكراً لتقييمك!");
        }
    }

    function openAdmin() {
        const keys = ["satar1990", "2026", "5588", "3344"];
        if (keys.includes(prompt("رمز الإدارة:"))) document.getElementById('admin-panel').style.display = 'block';
    }

    function closeAdmin() { document.getElementById('admin-panel').style.display = 'none'; }
    function delUser(key) { if(confirm("حذف؟")) db.ref('users/'+key).remove(); }
    function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
