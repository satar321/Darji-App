<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل ديرتك - النسخة الاحترافية</title>
    
    <!-- مكتبة الخرائط Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    
    <style>
        :root { --primary: #002d5b; --gold: #d4af37; --bg: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--bg); margin: 0; padding: 0; color: #333; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, #004a99 100%); color: white; padding: 40px 20px; text-align: center; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; }
        .container { max-width: 550px; margin: -20px auto 0; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 2px solid #eee; border-radius: 12px; box-sizing: border-box; }
        
        /* تصميم الخريطة */
        #map { height: 250px; width: 100%; border-radius: 15px; margin: 15px 0; border: 2px solid var(--primary); }
        .map-hint { font-size: 13px; color: #666; text-align: center; margin-bottom: 5px; }

        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-main { background: var(--primary); color: white; margin-top: 10px; }
        
        .worker-card { background: white; padding: 20px; margin-bottom: 15px; border-radius: 15px; border-right: 8px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn-call { background: #28a745; color: white; text-decoration: none; display: block; text-align: center; margin-top: 10px; padding: 10px; border-radius: 8px; }
        .btn-map { background: #ff9800; color: white; text-decoration: none; display: block; text-align: center; margin-top: 5px; padding: 10px; border-radius: 8px; }
        
        #reg-section, #profile-section { display: none; }
    </style>
</head>
<body>

<div class="header">
    <h1>🇮🇶 دليل ديرتك</h1>
    <p>حدد موقعك على الخريطة وسجل مهنتك</p>
</div>

<div class="container">
    <!-- قسم التسجيل -->
    <div id="reg-section" class="card">
        <h2 style="text-align:center;">تسجيل جديد ✨</h2>
        <input type="text" id="reg-name" placeholder="الأسم الكامل">
        <input type="tel" id="reg-phone" placeholder="رقم الموبايل">
        
        <select id="reg-type" onchange="toggleFields()">
            <option value="driver">سائق (أبحث عن أسطى)</option>
            <option value="worker">أسطى (صاحب مهنة)</option>
        </select>

        <div id="worker-extra" style="display:none;">
            <input type="text" id="reg-job" placeholder="المهنة (مثلاً: فيتر)">
            <input type="text" id="reg-area" placeholder="المنطقة">
        </div>

        <p class="map-hint">📍 حرك الخريطة واضغط لتحديد موقعك بدقة:</p>
        <div id="map"></div>
        <input type="hidden" id="lat"><input type="hidden" id="lng">

        <button class="btn btn-main" onclick="register()">حفظ البيانات والانضمام ✅</button>
    </div>

    <!-- قسم الملف الشخصي -->
    <div id="profile-section" class="card" style="text-align:center;">
        <h2 id="welcome-user">مرحباً</h2>
        <button class="btn btn-main" onclick="location.reload()">تحديث الصفحة</button>
        <button onclick="logout()" style="color:red; background:none; border:none; margin-top:20px; cursor:pointer;">خروج</button>
    </div>

    <h2 style="text-align:center; color: var(--primary);">🛠️ المهن المتوفرة حالياً</h2>
    <div id="display-list"></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDING7DzLK9YwWtdBt1CLJhFPOqRrCBo8s",
        authDomain: "darji-app-13348.firebaseapp.com",
        databaseURL: "https://darji-app-13348-default-rtdb.firebaseio.com",
        projectId: "darji-app-13348",
        storageBucket: "darji-app-13348.firebasestorage.app",
        messagingSenderId: "553323569740",
        appId: "1:553323569740:web:57075700fe68af3d010ae9"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // إعداد الخريطة يدوياً (تبدأ من ميسان افتراضياً)
    let map = L.map('map').setView([31.84, 47.14], 13); 
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    
    let marker = L.marker([31.84, 47.14], {draggable: true}).addTo(map);

    map.on('click', function(e) {
        marker.setLatLng(e.latlng);
        document.getElementById('lat').value = e.latlng.lat;
        document.getElementById('lng').value = e.latlng.lng;
    });

    window.onload = () => {
        if (localStorage.getItem('satar_system_user')) {
            document.getElementById('profile-section').style.display = 'block';
            document.getElementById('welcome-user').innerText = "أهلاً " + JSON.parse(localStorage.getItem('satar_system_user')).name;
        } else {
            document.getElementById('reg-section').style.display = 'block';
            // تحديث أبعاد الخريطة عند ظهور القسم
            setTimeout(() => { map.invalidateSize(); }, 400);
        }
        loadData();
    };

    function toggleFields() {
        document.getElementById('worker-extra').style.display = (document.getElementById('reg-type').value === 'worker') ? 'block' : 'none';
    }

    function register() {
        const name = document.getElementById('reg-name').value;
        const phone = document.getElementById('reg-phone').value;
        const lat = document.getElementById('lat').value || 31.84;
        const lng = document.getElementById('lng').value || 47.14;

        if(!name || !phone) return alert("أكمل الاسم والهاتف");

        const data = {
            name, phone, lat, lng,
            type: document.getElementById('reg-type').value,
            job: document.getElementById('reg-job').value || "سائق",
            area: document.getElementById('reg-area').value || "ميسان"
        };

        const ref = db.ref('users').push();
        ref.set(data).then(() => {
            localStorage.setItem('satar_system_user', JSON.stringify(data));
            location.reload();
        });
    }

    function loadData() {
        db.ref('users').on('value', (snap) => {
            const list = document.getElementById('display-list');
            list.innerHTML = '';
            snap.forEach((child) => {
                const v = child.val();
                if(v.type === 'worker') {
                    list.innerHTML += `
                        <div class="worker-card">
                            <h3>الأسطى ${v.name} - ${v.job}</h3>
                            <p>📍 المنطقة: ${v.area}</p>
                            <a href="tel:${v.phone}" class="btn-call">📞 إتصال</a>
                            <a href="https://www.google.com/maps?q=${v.lat},${v.lng}" target="_blank" class="btn-map">📍 فتح الموقع</a>
                        </div>`;
                }
            });
        });
    }

    function logout() { localStorage.clear(); location.reload(); }
</script>
</body>
</html>
